name: Build & Release Binaries (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: sdpad-gui-linux
            asset_name: sdpad-gui-linux-x86_64
          - os: windows-latest
            artifact_name: sdpad-gui.exe
            asset_name: sdpad-gui-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.artifact_name }}" sdpad_gui.py

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "sdpad-gui" sdpad_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: sdpad-gui-linux-x86_64
          path: ./release-assets

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: sdpad-gui-windows-x64.exe
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/sdpad-gui-linux
            ./release-assets/sdpad-gui.exe
          draft: false
          prerelease: false
          generate_release_notes: true
